[package]
name = "barqr"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, scan-reliable black/white QR code generator and decoder (PNG / SVG) powered by Rust + WASM"
license = "MIT"
repository = "https://github.com/wirunrom/barqr"
keywords = ["qrcode", "qr", "wasm", "png", "svg"]
categories = ["encoding", "multimedia::images", "wasm"]
exclude = ["/pkg", "/react", "/react-src", "/tests/my-app", "/tests/node", "/.github", "/fuzz"]

[lib]
name = "barqr"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["generate"]

# Encoder: QR module generation + PNG/SVG rendering.
generate = ["dep:fast_qr", "dep:png"]
# 1D barcodes (Code128, Code39/93/11, Codabar, EAN-8/13, ITF). Costs almost
# nothing in the binary — a 1D symbology is lookup tables and bit patterns,
# against the Reed-Solomon and masking machinery QR needs.
barcode = ["generate", "dep:barcoders"]
# Decoder: reads QR out of raw RGBA or encoded image bytes.
decode = ["dep:image", "dep:rqrr"]
# Decoder for every symbology rxing supports — QR plus the 1D formats, plus
# DataMatrix, PDF417 and Aztec. Costs ~220 KB gzipped over `decode`, which is
# why it ships as its own WASM module rather than replacing rqrr: a page that
# only reads QR should not pay for it.
decode-any = ["dep:image", "dep:rxing", "dep:getrandom"]
# JS bindings. Compose with `generate` and/or `decode` to pick what ships.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys       = { version = "0.3", optional = true }

# --- generate ---
# `default-features = false`: we render PNG/SVG ourselves, fast_qr's own
# converters would pull in image/svg stacks we never call.
fast_qr = { version = "0.13", default-features = false, optional = true }
# `default-features = false`: barcoders ships its own SVG/ASCII/image writers,
# and we already have renderers that outperform them.
barcoders = { version = "2.0", default-features = false, features = [
  "std",
], optional = true }
# Kept in lockstep with the `png` that `image` depends on so the WASM binary
# never contains two copies of the PNG codec.
png = { version = "0.18", optional = true }

# --- decode ---
# `default-features = false` + an explicit codec list. The default feature set
# compiles tiff/dds/exr/hdr/pnm/ico/bmp/gif decoders that a QR scanner will
# never see, and they dominated the WASM binary (1.4 MB -> 0.7 MB by dropping
# them). png/jpeg/webp covers every format a camera or <canvas> produces.
image = { version = "0.25", optional = true, default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
rqrr  = { version = "0.10", optional = true }
# `default-features = false` plus only what a decoder needs. The defaults add
# result-content parsing (chrono-tz, fancy-regex, uriparse), serde, the encoder
# side, and rxing's own image integration — none of which this crate calls,
# since it hands rxing a luminance buffer and wants the text back.
rxing = { version = "0.9", default-features = false, features = [
  "decoders",
  "full_barcode_format_support",
  "multi_barcode_readers",
  "encoding_rs",
  # chrono/wasmbind. rxing reaches for `Utc::now()`, which panics on
  # wasm32-unknown-unknown without a browser clock behind it — and with
  # `panic = "abort"` that surfaces as a bare `RuntimeError: unreachable`.
  "wasm_support",
], optional = true }

# rxing pulls in `rand`, and therefore `getrandom`. On wasm32-unknown-unknown
# getrandom 0.2 has no backend unless its `js` feature is on, and a call without
# one aborts — which, with `panic = "abort"`, surfaces as a bare
# `RuntimeError: unreachable` with no message to go on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"], optional = true }

[dev-dependencies]
criterion = "0.5"
# Only for writing the fuzz seed corpus: JPEG is a far more complex decoder than
# PNG, and a corpus without any would leave most of that surface unexercised.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# `required-features` on every target that needs more than the defaults.
# Without it Cargo builds them under whatever features happen to be active, and
# an editor's rust-analyzer uses the defaults — so a file that is perfectly fine
# under `cargo test --features decode` shows as broken while you edit it.
[[bench]]
name = "generate"
harness = false
required-features = ["generate"]

[[example]]
name = "decode_limits"
required-features = ["generate", "decode"]

[[example]]
name = "fuzz_seeds"
required-features = ["generate"]

[[test]]
name = "barcode_roundtrip"
required-features = ["barcode", "decode-any"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# -Oz costs a few microseconds on a sub-millisecond pipeline and buys ~15% off
# the binary every user has to download before the first QR renders.
#
# `--all-features` matches wasm-opt's accepted feature set to whatever rustc and
# wasm-bindgen actually emitted. Naming features by hand (bulk-memory, ...) makes
# wasm-opt reject the module the moment the toolchain starts using one more.
wasm-opt = ["-Oz", "--all-features"]
