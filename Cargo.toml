[package]
name = "hqr-generate"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, scan-reliable black/white QR code generator and decoder (PNG / SVG) powered by Rust + WASM"
license = "MIT"
repository = "https://github.com/wirunrom/hqr-generate"
keywords = ["qrcode", "qr", "wasm", "png", "svg"]
categories = ["encoding", "multimedia::images", "wasm"]
exclude = ["/pkg", "/react", "/react-src", "/tests/my-app", "/.github"]

[lib]
name = "hqr_generate"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["generate"]

# Encoder: QR module generation + PNG/SVG rendering.
generate = ["dep:fast_qr", "dep:png"]
# Decoder: reads QR out of raw RGBA or encoded image bytes.
decode = ["dep:image", "dep:rqrr"]
# JS bindings. Compose with `generate` and/or `decode` to pick what ships.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys       = { version = "0.3", optional = true }

# --- generate ---
# `default-features = false`: we render PNG/SVG ourselves, fast_qr's own
# converters would pull in image/svg stacks we never call.
fast_qr = { version = "0.13", default-features = false, optional = true }
# Kept in lockstep with the `png` that `image` depends on so the WASM binary
# never contains two copies of the PNG codec.
png = { version = "0.18", optional = true }

# --- decode ---
# `default-features = false` + an explicit codec list. The default feature set
# compiles tiff/dds/exr/hdr/pnm/ico/bmp/gif decoders that a QR scanner will
# never see, and they dominated the WASM binary (1.4 MB -> 0.7 MB by dropping
# them). png/jpeg/webp covers every format a camera or <canvas> produces.
image = { version = "0.25", optional = true, default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
rqrr  = { version = "0.7", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "generate"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
# -Oz costs a few microseconds on a sub-millisecond pipeline and buys ~15% off
# the binary every user has to download before the first QR renders.
#
# `--all-features` matches wasm-opt's accepted feature set to whatever rustc and
# wasm-bindgen actually emitted. Naming features by hand (bulk-memory, ...) makes
# wasm-opt reject the module the moment the toolchain starts using one more.
wasm-opt = ["-Oz", "--all-features"]
