name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the GitHub release.
      contents: write
      # Required for npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install wasm toolchain
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npm run test:rust
      - run: npm run test:node

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"

          # npm does not infer the dist-tag from a prerelease version: without
          # this, pushing v0.7.0-next.0 would make it `latest` for everyone.
          case "$version" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          echo "prerelease=$([ "$dist_tag" = next ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Publishing $version to dist-tag $dist_tag"

          # --ignore-scripts publishes exactly the tree the steps above built,
          # size-checked and tested. Without it `prepack` would wipe pkg/ and
          # rebuild, so the tarball would not be the one that was verified — and
          # `postpublish` would try to push from the runner's detached HEAD and
          # fail the step after the package was already live.
          npm publish --access public --provenance --tag "$dist_tag" --ignore-scripts

      # Runs only after npm accepted the package, so a failed publish never
      # leaves a release pointing at a version nobody can install.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.publish.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"

          if [ -f "$notes" ]; then
            # First line is the `# ` heading; it becomes the release title.
            title="$(head -1 "$notes" | sed 's/^# *//')"
            tail -n +2 "$notes" > /tmp/release-body.md
            gh release create "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file /tmp/release-body.md \
              --verify-tag $PRERELEASE
          else
            echo "::warning::no .github/release-notes/${GITHUB_REF_NAME}.md — falling back to generated notes"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag $PRERELEASE
          fi
